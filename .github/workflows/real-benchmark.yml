name: Real RAG benchmark

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4o-mini
      DEEPEVAL_MODEL: gpt-4o-mini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate core and golden dataset
        run: |
          pytest tests/ -v
          python validate_golden_dataset.py
      - name: Require OpenAI secret
        run: |
          test -n "$OPENAI_API_KEY" || (echo "Repository secret OPENAI_API_KEY is missing" && exit 1)
      - name: Generate real RAG answers
        run: python domain_assistant.py
      - name: Evaluate answers
        run: python evaluate_answers.py
      - name: Run framework comparison bonus
        run: python bonus_framework_compare.py
      - name: Run reranking bonus
        run: python bonus_rerank.py
      - name: Finalize exercises and reflection
        run: python finalize_lab.py
      - name: Re-run tests
        run: pytest tests/ -v
      - name: Commit benchmark deliverables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/actual_answers.json artifacts/benchmark_results.json artifacts/bonus_framework_comparison.json artifacts/bonus_rerank_results.json exercises.md reflection.md
          git diff --cached --quiet && exit 0
          git commit -m "eval: add real benchmark results, bonuses, and reflection"
          git push
